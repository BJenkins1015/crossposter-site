<!doctype html>
<!--
  CrossPoster sign-in redirect.

  Meta (Instagram, Facebook, Threads) and TikTok only send sign-in results to an https address, but
  CrossPoster is a Mac app. Register https://bjenkins1015.github.io/crossposter-site/oauth/callback.html
  as the redirect URI; this page passes the result on to the app at crossposter://oauth/callback.

  The page loads nothing from other sites, has no analytics, and sends the one-time sign-in code
  nowhere except the CrossPoster app on this Mac.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Returning to CrossPoster</title>
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <style>
    :root {
      --bg: #f6f4fb;
      --card: #ffffff;
      --ink: #1d1530;
      --muted: #6b6380;
      --brand: #5b21b6;
      --brand-ink: #ffffff;
      --error: #b42318;
      --border: #e6e1f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #120c1f;
        --card: #1d1530;
        --ink: #f3effa;
        --muted: #a9a0bd;
        --brand: #8b5cf6;
        --error: #f97066;
        --border: #2e2445;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      text-align: center;
    }
    .mark { display: block; width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 13px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: var(--muted); }
    p.error { color: var(--error); }
    .button {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      background: var(--brand);
      color: var(--brand-ink);
      font-weight: 600;
      text-decoration: none;
    }
    .hidden { display: none; }
    small { display: block; margin-top: 16px; color: var(--muted); font-size: 13px; }
    small a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="../images/icon.png" alt="" width="56" height="56">
    <h1 id="title">Returning to CrossPoster…</h1>
    <p id="message">Finishing sign-in. You can close this tab once CrossPoster opens.</p>
    <a id="open" class="button hidden" href="#">Open CrossPoster</a>
    <small><a href="../privacy.html">Privacy Policy</a></small>
  </main>

  <script>
    (function () {
      // Only these sign-in fields are passed on; anything else in the URL is ignored.
      var allowed = ['code', 'state', 'scopes', 'error', 'error_reason', 'error_description',
                     'error_code', 'error_message'];
      var incoming = new URLSearchParams(window.location.search);
      var outgoing = new URLSearchParams();
      allowed.forEach(function (key) {
        var value = incoming.get(key);
        if (value !== null) outgoing.set(key, value);
      });

      // Take the code out of the address bar and browser history.
      window.history.replaceState(null, '', window.location.pathname);

      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var open = document.getElementById('open');

      if (!outgoing.has('code') && !outgoing.has('error') && !outgoing.has('error_code')) {
        title.textContent = 'CrossPoster sign-in';
        message.textContent = 'This page finishes signing in to CrossPoster. There’s nothing to do here.';
        return;
      }

      var target = 'crossposter://oauth/callback?' + outgoing.toString();
      open.href = target;

      if (outgoing.has('error') || outgoing.has('error_code')) {
        // Still pass it on, so CrossPoster stops waiting and can show what happened.
        title.textContent = 'Sign-in didn’t finish';
        message.className = 'error';
        message.textContent = outgoing.get('error_description') || outgoing.get('error_message')
          || outgoing.get('error_reason') || outgoing.get('error') || 'The platform reported an error.';
        open.textContent = 'Back to CrossPoster';
        open.className = 'button';
      }

      window.location.replace(target);

      // If the app didn't open (not installed, or the browser asked first), offer a button.
      setTimeout(function () {
        open.className = 'button';
        if (!outgoing.has('error') && !outgoing.has('error_code')) {
          message.textContent = 'If CrossPoster didn’t open, click the button. Your browser may ask for permission first.';
        }
      }, 1500);
    })();
  </script>
</body>
</html>
